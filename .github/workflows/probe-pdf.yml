# TEMPORARY (removed in the next commit): which conditions let the ubuntu-24.04 runner's Chromium print a PDF
# headless. ai-eda's prints there time out (install workflow, 2026-10-14) while the same flags print in 1 s
# in an Arch container and in a plain Ubuntu 24.04 container.
name: probe-pdf
on:
  push:
    paths: [".github/workflows/probe-pdf.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: probe
        shell: bash
        run: |
          set +e
          echo "== env"; env | grep -iE 'dbus|xdg|display|wayland|chrome|session' | sort
          echo "== browsers"; for b in chromium chromium-browser google-chrome google-chrome-stable; do p=$(command -v $b); [ -n "$p" ] && echo "$b -> $p -> $(readlink -f $p)"; done
          google-chrome --version; ls -la /usr/local/share/chromium 2>&1 | head -5
          d=$(mktemp -d); printf '<!doctype html><html><body><h1>hello</h1></body></html>' > $d/t.html
          FLAGS="--headless=new --no-sandbox --disable-gpu --no-first-run --disable-extensions --disable-background-networking --disable-component-update --disable-sync --disable-breakpad --password-store=basic --use-mock-keychain --no-pdf-header-footer --no-proxy-server"
          try() {  # name, browser, extra env/flags...
            name=$1; shift; br=$1; shift
            out=$d/$name.pdf; prof=$(mktemp -d)
            start=$(date +%s)
            timeout -k 5 45 env "$@" $br $FLAGS "--host-resolver-rules=MAP * ~NOTFOUND" --user-data-dir=$prof --print-to-pdf=$out file://$d/t.html > $d/$name.out 2> $d/$name.err
            rc=$?
            echo "== $name: rc=$rc after $(( $(date +%s) - start )) s, pdf=$( [ -s $out ] && wc -c < $out || echo none)"
            grep -v 'dbus/' $d/$name.err | tail -5
            pkill -f "$prof" 2>/dev/null; sleep 1
          }
          try chromium_ours /usr/bin/chromium X=1
          try chromium_no_dbus /usr/bin/chromium -u DBUS_SESSION_BUS_ADDRESS
          try chromium_dbus_disabled /usr/bin/chromium DBUS_SESSION_BUS_ADDRESS=disabled:
          try chrome_stable "$(command -v google-chrome)" X=1
          FLAGS="$FLAGS --disable-search-engine-choice-screen --no-default-browser-check --disable-default-apps --disable-dev-shm-usage"
          try chromium_more_flags /usr/bin/chromium X=1
          FLAGS="$FLAGS --enable-logging=stderr --v=1"
          try chromium_verbose /usr/bin/chromium X=1
          echo "== verbose stderr (last 60 lines without dbus)"; grep -v 'dbus/' $d/chromium_verbose.err | tail -60
