[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-eda-engineer"
version = "0.0.1"
description = "AI EDA ENGINEER - verification-first, IR-centred AI electronic design engineering system"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
llm = ["httpx>=0.27"]
dev = ["pytest>=8"]

[project.scripts]
ai-eda = "ai_eda.cli:main"

[tool.setuptools.packages.find]
include = ["ai_eda*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
